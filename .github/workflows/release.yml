name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # OIDC. Authenticates the publish itself (npm trusted publishing) and
      # signs the provenance attestation. No npm token is involved.
      id-token: write
      contents: write   # for GitHub Release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # No dependency cache in a release build: what gets published must
          # come from a clean resolve of the lockfile, not from whatever a
          # cache happened to restore.

      # Node 24 bundles npm 11.x, but the exact patch moves with the runner
      # image. Pin the floor the OIDC exchange needs rather than trusting it.
      - name: Ensure npm can do trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # `npm publish`, not `pnpm publish`: the OIDC exchange lives in the npm
      # CLI, and pnpm 9.6.0 has no documented support for it.
      #
      # No `--provenance` flag: publishing through a trusted publisher from a
      # public repo generates the attestation automatically.
      - name: Publish to npm via trusted publishing
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
